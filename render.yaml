# Render Blueprint — Arckaton OS (site public + dashboard + API Express)
# Utilisation : Render Dashboard > New > Blueprint > coller ce fichier,
# ou copier-coller le contenu dans "From existing repository".
# Les variables DATABASE_URL/JWT_SECRET et clés IA sont demandées à la création
# (jamais commitées).
services:
  - type: web
    name: arckaton-os
    runtime: node
    region: oregon
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # P0 — NODE_ENV manquait. Sans lui, `npm start` ne passe pas en mode
      # production : les erreurs révèlent leur pile d'appels, et la
      # configuration "stricte" du serveur (mode production) n'est jamais
      # activée.
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false