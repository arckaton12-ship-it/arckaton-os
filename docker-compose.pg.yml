# ============================================================
#  PostgreSQL autonome —Arckaton OS
#
#  Remplace la pileSupabase (PostgREST + GoTrue + schemas `auth`
#  et `storage`). On ne garde ici que le moteur : le serveur Express
#  parle directement en SQL parametre via `pg` (voir src/db).
#
#  Contrainte materielle : 8 Go de RAM sur la machine cible. Les
#  plafonds ci-dessous sont exprimes pour que PostgreSQL ne
#  concurrence pas l'application, qui doit rester fluide.
# ============================================================

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: arckaton_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PGDATABASE:-arckaton}
      POSTGRES_USER: ${PGUSER:-arckaton}
      # Mot de passe local par defaut. Surcharge obligatoire hors
      # developpement via .env ; compose lit le fichier d'environnement
      # racine automatiquement.
      POSTGRES_PASSWORD: ${PGPASSWORD:-arckaton_local}
      # Les connexions en clair sont refusees : l'application est sur le
      # meme reseau Docker, elle parle quand meme en TLS plutot qu'en
      # clair, et cela empeche qu'un `psql` distant.maps sans precautions.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256

    ports:
      # Port d'ADMINISTRATION sur l'hote (psql, migrations).
      #
      # 5434 et non 5432/5433 : les deux autres sont deja pris sur la
      # machine de developpement, et Docker Desktop peut alors
      # router le trafic vers le PostgreSQL natif de Windows plutot
      # que vers ce conteneur — un echec trompeur, puisque le serveur
      # atteint repond correctement mais n'est pas le bon.
      #
      # L'application, elle, ne passe pas par ce port : elle rejoint
      # le conteneur par le reseau Docker (PGHOST=arckaton_db), ce qui
      # evite l'expose au monde et un aller-retour NAT.
      #
      # IMPORTANT : lie uniquement a localhost, pas a 0.0.0.0. Cela
      # limite l'acces au seul hote local, meme si le port est expose.
      - '127.0.0.1:${PGPORT_ADMIN:-5434}:5432'

    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations appliquees au demarrage, dans l'ordre des noms de
      # fichier. `db:init` joue le role que tenait le schema `auth`
      # de Supabase : il cree les roles necessaires.
      - ./migrations:/docker-entrypoint-initdb.d:ro

    # mem_limit n'est pas honore par compose v2 sur tous les runtimes ;
    # on fixe donc les deux cotes (compose v2 + docker engine).
    mem_limit: 512m
    mem_reservation: 256m

    command:
      - postgres
      # 256 Mo de shared_buffers : laisse la majority de la RAM a
      # l'OS et a l'application, sur une machine de 8 Go.
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      # Le RAG est en cours de construction (pgvector) : on prevoit
      # l'extension des totes que le projet embarque, pas plus.
      - -c
      - max_connections=60

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PGUSER:-arckaton} -d ${PGDATABASE:-arckaton}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  pgdata:
    driver: local
